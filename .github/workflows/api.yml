name: API

on:
  push:
    paths:
      - "apps/server/**"
      - "packages/shared/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "apps/server/**"
      - "packages/shared/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/api.yml"
  workflow_dispatch:

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: voicetalk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d voicetalk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/voicetalk
      REDIS_URL: redis://127.0.0.1:6379
      SMOKE_TESTS: "1"
      PLATFORM_ADMIN_EMAIL: superadmin@lorescale.com
      PLATFORM_ADMIN_PASSWORD: superadmin123
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run --filter server lint
      - name: Typecheck
        run: bun run --filter server typecheck
      - name: Migrate and seed
        working-directory: apps/server
        run: |
          bun scripts/migrate.ts
          bun scripts/seed.ts
      - name: Tests
        working-directory: apps/server
        run: bun test
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          push: false
          load: true
          tags: voicetalk-api:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=api-image
          cache-to: type=gha,scope=api-image,mode=max
      - name: Smoke the image
        run: |
          docker run -d --name api-image --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e REDIS_URL="$REDIS_URL" \
            -e PORT=8098 \
            -e S3_ENDPOINT=http://127.0.0.1:9 \
            -e S3_BUCKET=ci \
            -e S3_ACCESS_KEY_ID=ci \
            -e S3_SECRET_ACCESS_KEY=ci \
            -e S3_PUBLIC_BASE_URL=http://127.0.0.1:9 \
            -e PUBLIC_API_URL=https://api.example.com \
            -e PLATFORM_ADMIN_EMAIL="$PLATFORM_ADMIN_EMAIL" \
            -e PLATFORM_ADMIN_PASSWORD="$PLATFORM_ADMIN_PASSWORD" \
            voicetalk-api:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8098/health >/dev/null; then break; fi
            sleep 1
          done
          curl -sf "http://127.0.0.1:8098/health?db=1" | grep -q '"db_online":true'
          curl -sf "http://127.0.0.1:8098/health?db=1" | grep -q '"redis_online":true'
          docker rm -f api-image

  publish:
    name: Publish image to GHCR
    needs: checks
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preview-deploy' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=api-image
          cache-to: type=gha,scope=api-image,mode=max
