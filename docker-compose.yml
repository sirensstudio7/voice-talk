services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: voicetalk
    volumes:
      - voicetalk_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d voicetalk"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      # Host port 6380, not 6379 — an unrelated project's Redis container
      # is already bound to 6379 on this machine. Internal container port
      # stays 6379.
      - "6380:6379"
    volumes:
      - voicetalk_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  voicetalk_pg:
  voicetalk_redis:
